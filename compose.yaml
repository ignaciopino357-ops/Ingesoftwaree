# Despliegue local del sistema de seguimiento de trayectorias (Semana 15).
# Un solo servicio: la app FastAPI sirve los portales web y la API REST.
# SQLite es un archivo, no un servidor: vive en el volumen liceo_data.
services:
  app:
    build: .
    image: seguimiento-trayectorias:local
    environment:
      LICEO_DB: /app/data/liceo.db
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - liceo_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  liceo_data:
