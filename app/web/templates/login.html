{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta login">
  <h1>Iniciar sesión</h1>
  <p class="suave">Entre con su usuario del liceo. Llegará directo a su portal.</p>
  {% if error %}<div class="aviso error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="formulario">
    <label>Usuario <input name="usuario" value="{{ usuario_escrito or '' }}" autocomplete="username" required autofocus></label>
    <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
    <button class="principal">Entrar</button>
  </form>
</section>
{% endblock %}
